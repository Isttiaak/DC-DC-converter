name: Boost converter PID study (MATLAB/Simulink)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "build/**"
      - "model/**"
      - "run_all.m"
      - ".github/workflows/simulate.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = install check, quick = short run, full = complete study"
        required: true
        default: full
        type: choice
        options: [smoke, quick, full]
      rebuild:
        description: "Rebuild model/boost_PID.slx from build/boost_GWO_PID.slx"
        required: false
        default: false
        type: boolean
      layout:
        description: "repo = run_all in the repository; flat = all files copied into ONE folder, then run_step_by_step"
        required: false
        default: repo
        type: choice
        options: [repo, flat]

permissions:
  contents: write

concurrency:
  group: simulate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Virtual display and fonts (figure text layout, model diagram)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-liberation fonts-dejavu-core > /dev/null
          Xvfb :99 -screen 0 2560x1600x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up MATLAB R2025a + Simulink + Simscape Electrical
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025a
          products: Simulink Simscape Simscape_Electrical
          cache: true

      - name: Smoke test
        if: inputs.mode == 'smoke'
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('tests'); smoke_test

      - name: Run the study with every file in one folder (run_step_by_step)
        if: inputs.mode != 'smoke' && inputs.layout == 'flat'
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            mkdir('flat'); copyfile('src/*.m', 'flat'); copyfile('scripts/*.m', 'flat');
            copyfile('build/*', 'flat'); copyfile('model/*.slx', 'flat');
            copyfile('run_all.m', 'flat'); copyfile('run_step_by_step.m', 'flat');
            if isfolder('results'), rmdir('results', 's'); end;
            cd flat; mkdir('results'); diary(fullfile('results', 'run_log.txt')); disp(ls);
            try, run_step_by_step; ok = true; catch e, ok = false; fprintf('*** ERROR ***\n%s\n', getReport(e, 'extended', 'hyperlinks', 'off')); end;
            diary off; cd ..; movefile('flat/results', 'results'); assert(ok, 'run_step_by_step failed');

      - name: Run the study
        if: inputs.mode != 'smoke' && inputs.layout != 'flat'
        uses: matlab-actions/run-command@v2
        env:
          REBUILD_MODEL: ${{ inputs.rebuild && '1' || '0' }}
        with:
          command: run_all('${{ inputs.mode }}')

      - name: Keep the model that was simulated
        if: always()
        run: |
          if [ -f model/boost_PID.slx ]; then mkdir -p results/model && cp model/boost_PID.slx results/model/; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.mode || 'full' }}-run${{ github.run_number }}
          path: results/
          if-no-files-found: ignore

      - name: Publish results to the ci-results branch
        if: always()
        run: |
          if [ -z "$(ls -A results 2>/dev/null)" ]; then echo "no results"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-results-tmp
          git rm -rf --cached . > /dev/null
          git add -f results
          git commit -q -m "Results of run ${{ github.run_number }} (${{ inputs.mode || 'full' }}) [skip ci]"
          git push -f origin HEAD:ci-results
